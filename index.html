<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emberline Cloud Saves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030303;--panel:#191919;--panel2:#151515;--line:#5b5b5b;
  --text:#f3f3f3;--muted:#d3d3d3;--green:#314c18;--green2:#466b23;--blue:#0099ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
html{scroll-behavior:smooth}
body{font-family:"Pixelify Sans",monospace;letter-spacing:0;overflow-x:hidden;-webkit-font-smoothing:none;text-rendering:geometricPrecision}
button,a{font:inherit}a{color:inherit}
button{appearance:none;-webkit-tap-highlight-color:transparent}
.app{min-height:100vh;position:relative;isolation:isolate}
.app::before,.app::after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.10}
.app::before{width:300px;height:300px;left:-170px;top:20%;background:#4d7d25;animation:ambient 9s ease-in-out infinite}
.app::after{width:260px;height:260px;right:-150px;bottom:10%;background:#315d7b;animation:ambient 11s 1.5s ease-in-out infinite reverse}
.page{min-height:100vh;padding:28px 6vw 70px;animation:pageIn .48s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes floatIn{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes ambient{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(20px,-24px,0) scale(1.08)}}
@keyframes fire{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-3px) rotate(2deg) scale(1.04)}}
@keyframes shine{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes copied{0%{transform:scale(1)}45%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
.logoRow{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:700;animation:floatIn .5s ease both}
.fire{display:inline-block;animation:fire 1.8s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(255,104,28,.22))}
.logoWord{font-family:"Pixelify Sans",monospace;font-size:25px;letter-spacing:-1px}
.logoSub{font-size:24px;margin-left:2px}
.brandLogo{display:block;width:215px;height:auto;image-rendering:auto;filter:drop-shadow(0 0 7px rgba(255,90,30,.10));transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s ease}
.logoRow:hover .brandLogo{transform:translateY(-1px) scale(1.012);filter:drop-shadow(0 0 12px rgba(255,90,30,.18))}
.heroBrand{width:430px;max-width:78vw}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px}
 .helpBtn{text-decoration:none;font-weight:700;font-size:25px;transition:transform .22s ease,text-shadow .22s ease,opacity .22s ease}
.helpBtn:hover{transform:translateY(-2px);text-shadow:0 0 14px rgba(255,255,255,.3)}
.helpBtn:active{transform:translateY(0) scale(.97)}
.hero{text-align:center;margin-bottom:104px}
.hero .logoRow{justify-content:center;margin-bottom:2px}
.hero .logoWord{font-size:43px}
.hero .logoSub{font-size:27px}
 .heroText{margin:34px auto 0;max-width:760px;font-size:18px;line-height:1.55;animation:floatIn .65s .08s ease both}
.saves{display:flex;justify-content:center;gap:138px;flex-wrap:wrap}
.saveCard{position:relative;width:354px;min-height:400px;background:linear-gradient(145deg,#1d1d1d,#171717);border:1px solid #5b5b5b;padding:25px 28px 27px;text-align:center;box-shadow:0 12px 38px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.025);overflow:hidden;animation:floatIn .65s ease both;transition:transform .32s cubic-bezier(.2,.8,.2,1),border-color .32s ease,box-shadow .32s ease,background .32s ease}
.saveCard::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.045) 45%,transparent 62%);transform:translateX(-130%);opacity:0}
.saveCard:hover::before{opacity:1;animation:shine 1.1s ease}
.saveCard:nth-child(2){animation-delay:.12s}
.saveCard:hover{transform:translateY(-8px);border-color:#737373;box-shadow:0 20px 52px rgba(0,0,0,.5),0 0 30px rgba(91,137,52,.055),inset 0 1px rgba(255,255,255,.035);background:linear-gradient(145deg,#202020,#171717)}
 .cardTitle{font-size:19px;font-weight:700;margin-bottom:13px;position:relative;z-index:1}
.thumb{width:265px;height:132px;max-width:100%;object-fit:cover;border-radius:20px;display:block;margin:0 auto;filter:saturate(.98) contrast(1.01);transition:transform .4s cubic-bezier(.2,.8,.2,1),filter .4s ease,box-shadow .4s ease}
.saveCard:hover .thumb{transform:scale(1.025);filter:saturate(1.08) contrast(1.03);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.codeRow{margin:12px 0 19px;display:flex;justify-content:center;align-items:center;gap:8px;position:relative;z-index:2}
 .code{font-size:17px;font-weight:700;letter-spacing:1px}
.copyMini{width:31px;height:31px;padding:0;border:1px solid #4e4e4e;border-radius:8px;background:linear-gradient(145deg,#242424,#151515);color:#bdbdbd;cursor:pointer;display:inline-grid;place-items:center;box-shadow:inset 0 1px rgba(255,255,255,.06),0 4px 10px rgba(0,0,0,.18);transition:transform .2s ease,color .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}
.copyMini:hover{transform:translateY(-2px);color:#fff;border-color:#747474;background:linear-gradient(145deg,#2c2c2c,#191919);box-shadow:inset 0 1px rgba(255,255,255,.08),0 7px 16px rgba(0,0,0,.28)}
.copyMini:active{transform:translateY(0) scale(.94)}
.copyMini.copied{color:#c8e7a8;border-color:#607b49;animation:copied .38s ease}
.copyMini svg{width:17px;height:17px;display:block}
.detailsBtn{position:relative;overflow:hidden;border:1px solid #64774e;color:#fff;background:linear-gradient(#334c20,#263b17);border-radius:999px;padding:8px 24px;cursor:pointer;font-weight:700;font-size:13px;box-shadow:inset 0 1px rgba(255,255,255,.12),0 0 0 rgba(91,137,52,0);transition:transform .22s ease,box-shadow .25s ease,background .25s ease,border-color .25s ease}
.detailsBtn::after{content:"";position:absolute;top:-20%;left:-55%;width:35%;height:140%;background:rgba(255,255,255,.16);transform:skewX(-20deg);transition:none}
.detailsBtn:hover::after{animation:shine .8s ease}
.detailsBtn:hover{transform:translateY(-2px);background:linear-gradient(#405d28,#2d451b);border-color:#77905d;box-shadow:0 5px 18px rgba(91,137,52,.18),inset 0 1px rgba(255,255,255,.15)}
.detailsBtn:active{transform:translateY(0) scale(.97)}
.stats{margin-top:27px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px 4px;font-size:12px;position:relative;z-index:1}
.stats span:nth-child(4){grid-column:1/3}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(25,25,25,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #5b5b5b;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;z-index:20;font-size:17px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0);animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.back{display:inline-block;margin:5px 0 66px 0;text-decoration:none;font-size:19px;font-weight:700;transition:transform .22s ease,opacity .22s ease}
.back:hover{transform:translateX(-5px);opacity:.82}
.detailGrid{display:grid;grid-template-columns:354px 1fr;gap:72px;align-items:start;max-width:1120px;margin:0 auto}
.detailCard{min-height:366px}
.detailInfo{display:grid;grid-template-columns:230px minmax(280px,1fr) 250px;gap:48px;font-size:17px;line-height:1.55;align-items:start}
.resourceList{white-space:nowrap}.metricBlock{white-space:nowrap}.heading{font-weight:700}.metricBlock .heading{font-weight:400}.section{margin-bottom:13px}.achievementList{white-space:nowrap}
.glitch{grid-column:2/4;margin-top:4px}.glitchImg{width:min(100%,425px);height:auto;margin-top:18px;display:block;border-radius:2px;image-rendering:auto;box-shadow:0 8px 25px rgba(0,0,0,.25)}
.helpPage{max-width:1120px;margin:0 auto}.helpPage h1{font-size:28px;margin:0 0 2px}.helpLead{font-size:18px;margin:0 0 60px}.step{margin-bottom:40px}.step h2{font-size:20px;margin:0 0 10px}.step p{font-size:16px;line-height:1.55;margin:0 0 19px}.blueLink{color:var(--blue);text-decoration:underline;transition:filter .2s ease}.blueLink:hover{filter:brightness(1.2)}.helpShot{display:block;max-width:100%;height:auto}
@media(max-width:1000px){.saves{gap:35px}.detailGrid{grid-template-columns:354px 1fr;gap:42px}.detailInfo{grid-template-columns:1fr 1fr}.glitch{grid-column:1/-1}}
@media(max-width:900px){.page{padding:22px 24px 60px}.topbar{margin-bottom:52px}.hero{margin-bottom:70px}.saves{gap:30px}.detailGrid{grid-template-columns:1fr;gap:35px}.detailInfo{grid-template-columns:1fr 1fr}.glitch{grid-column:1/-1}}
@media(max-width:560px){.logoRow{font-size:20px}.logoWord{font-size:18px}.logoSub{font-size:18px}.brandLogo{width:175px}.heroBrand{width:320px}.hero .logoSub{font-size:21px}.helpBtn{font-size:19px}.heroText{font-size:14px}.saveCard{width:min(100%,354px)}.detailInfo{grid-template-columns:1fr;font-size:21px}.achievementList,.resourceList,.metricBlock{white-space:normal}.thumb{width:265px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
</head>

function card(save,key){
  return `<article class="saveCard">
    <div class="cardTitle">${save.title}</div>
    <img class="thumb" src="${save.image}" alt="${save.title}">
    <div class="codeRow">
      <span class="code">${save.code}</span>
      <button class="copyMini" title="Copy code" aria-label="Copy code" onclick="copyCode('${save.code}', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"></path></svg></button>
    </div>
    <button class="detailsBtn" onclick="location.hash='${key}'">Details --&gt;</button>
    <div class="stats">${save.stats.map(x=>`<span>${x}</span>`).join("")}</div>
  </article>`;
}

function render(){
  const route=location.hash.replace("#","").toLowerCase();
  document.getElementById("app").innerHTML =
    route==="classical" ? classical() :
    route==="medieval" ? medieval() :
    route==="industrial" ? industrial() :
    route==="help" ? help() : home();
  window.scrollTo({top:0,behavior:"smooth"});
}
async function copyCode(code, button){
  try{
    await navigator.clipboard.writeText(code);
  }catch(e){
    const t=document.createElement("textarea");
    t.value=code;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();
  }
  if(button){
    button.classList.remove("copied");
    void button.offsetWidth;
    button.classList.add("copied");
    setTimeout(()=>button.classList.remove("copied"),900);
  }
  const toast=document.getElementById("toast");
  toast.textContent=`${code} copied!`;
  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");
  clearTimeout(window.__emberToast);
  window.__emberToast=setTimeout(()=>toast.classList.remove("show"),1500);
}
window.addEventListener("hashchange",render);
render();
